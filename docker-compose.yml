# Ambiente de desenvolvimento do dotProject BR.
#   docker compose up -d --build   →  http://localhost:8080
# Para testar com bancos existentes, aponte DP_DADOS para uma pasta FORA do
# repositório com dumps .sql (são executados na criação do banco). Nunca
# coloque dados reais dentro do repositório.
services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: dotproject
      MARIADB_DATABASE: dotproject
      MARIADB_USER: dotproject
      MARIADB_PASSWORD: dotproject
    volumes:
      - dpdb:/var/lib/mysql
      - ${DP_DADOS:-./docker/vazio}:/docker-entrypoint-initdb.d:ro
    ports:
      - "33060:3306"
  web:
    build: ./docker
    depends_on: [db]
    volumes:
      - ./:/var/www/html
      - ./docker/logs:/var/log/php
    ports:
      - "8080:80"
volumes:
  dpdb:
